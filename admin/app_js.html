<style>
  /* Стили визуального перетаскивания Drag & Drop */
  .drag-over {
    border: 2px dashed #6366f1 !important;
    background-color: rgba(99, 102, 241, 0.1) !important;
  }
  .dragging {
    opacity: 0.4;
    transform: scale(0.98);
  }
</style>

<script>
  // ====================================================================
  // ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ СОСТОЯНИЯ ВЕБ-АДМИНКИ «ОРАКУЛ»
  // ====================================================================
  let currentMainTab = 'catalog';
  let currentModerationMode = 'pending';
  let selectedIndices = new Set();
  let cachedData = [];

  // Данные глобального каталога и дерева категорий
  let globalCatalog = [];
  let globalTreeData = {};
  let activeModalPayload = {};
  let draggedEntity = null;

  // Данные телеметрии и мониторинга 19 модулей бота
  let healthModulesData = [];
  let healthPollingTimer = null;

  /**
   * Инициализация при полной загрузке DOM-дерева в браузере.
   */
  window.onload = function() {
    console.log('🔮 [Оракул Admin] Запуск клиентской логики и опрос сервисов...');
    
    // Первичная параллельная загрузка всех рабочих областей
    loadCatalog();
    loadModerationData();
    loadHealthData();

    // Запуск фонового сторожевого опроса телеметрии каждые 30 секунд
    if (healthPollingTimer) {
      clearInterval(healthPollingTimer);
    }
    
    healthPollingTimer = setInterval(function() {
      loadHealthData(true);
    }, 30000);
  };

  /**
   * Обновление верхнего индикатора статуса в шапке панели.
   * @param {string} text - Текст текущего статуса.
   */
  function setStatus(text) {
    const el = document.getElementById('statusIndicator');
    if (el) {
      el.innerHTML = `<i class="fa-solid fa-circle text-indigo-400 text-[9px] mr-1.5 animate-pulse"></i> ${text}`;
    }
  }

  // ====================================================================
  // 1. НАВИГАЦИЯ МЕЖДУ ГЛАВНЫМИ ВКЛАДКАМИ АДМИНКИ
  // ====================================================================

  /**
   * Переключение между 4 базовыми экранами системы.
   * @param {string} tab - 'catalog' | 'moderation' | 'health' | 'navigation'
   */
  function switchMainTab(tab) {
    currentMainTab = tab;

    // Переключение видимости основных секций
    const catalogEl = document.getElementById('catalogTab');
    const moderationEl = document.getElementById('moderationTab');
    const healthEl = document.getElementById('healthTab');
    const navEl = document.getElementById('navigationTab');

    if (catalogEl) catalogEl.classList.toggle('hidden', tab !== 'catalog');
    if (moderationEl) moderationEl.classList.toggle('hidden', tab !== 'moderation');
    if (healthEl) healthEl.classList.toggle('hidden', tab !== 'health');
    if (navEl) navEl.classList.toggle('hidden', tab !== 'navigation');

    // Стилизация активной кнопки вкладки «Глобальный эталон»
    const btnCatalog = document.getElementById('mainTabCatalogBtn');
    if (btnCatalog) {
      btnCatalog.className = tab === 'catalog'
        ? "py-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400 flex items-center space-x-2 whitespace-nowrap"
        : "py-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center space-x-2 whitespace-nowrap";
    }

    // Стилизация активной кнопки вкладки «Модерация слов»
    const btnMod = document.getElementById('mainTabModBtn');
    if (btnMod) {
      btnMod.className = tab === 'moderation'
        ? "py-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400 flex items-center space-x-2 whitespace-nowrap"
        : "py-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center space-x-2 whitespace-nowrap";
    }

    // Стилизация активной кнопки вкладки «Контроль функционала (19)»
    const btnHealth = document.getElementById('mainTabHealthBtn');
    if (btnHealth) {
      btnHealth.className = tab === 'health'
        ? "py-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400 flex items-center space-x-2 whitespace-nowrap"
        : "py-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center space-x-2 whitespace-nowrap";
    }

    // Стилизация активной кнопки вкладки «Навигация и сервисы»
    const btnNav = document.getElementById('mainTabNavBtn');
    if (btnNav) {
      btnNav.className = tab === 'navigation'
        ? "py-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400 flex items-center space-x-2 whitespace-nowrap"
        : "py-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 flex items-center space-x-2 whitespace-nowrap";
    }

    // При входе на вкладку мониторинга — внеочередной опрос телеметрии
    if (tab === 'health') {
      loadHealthData();
    }
  }

  // ====================================================================
  // 2. МОНИТОРИНГ ФУНКЦИОНАЛА И СТОРОЖЕВОЙ ТАЙМЕР (WATCHDOG)
  // ====================================================================

  /**
   * Загрузка данных жизнедеятельности 19 модулей и статуса Heartbeat.
   * @param {boolean} isSilent - Тихий режим без мерцания индикатора готовности.
   */
  async function loadHealthData(isSilent = false) {
    if (!isSilent) {
      setStatus('Опрос телеметрии...');
    }

    try {
      const response = await fetch('/api/health');
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const data = await response.json();

      if (data.status === 'SUCCESS') {
        healthModulesData = data.modules || [];

        // 1. Обновление верхнего общего индикатора связи
        const topBadge = document.getElementById('topConnectionBadge');
        if (topBadge) {
          if (data.connection_status === 'ONLINE') {
            topBadge.className = "text-xs px-3 py-1 rounded-full border bg-emerald-500/10 border-emerald-500/30 text-emerald-400";
            topBadge.innerHTML = `<i class="fa-solid fa-circle text-emerald-400 text-[9px] mr-1.5 animate-pulse"></i> В СЕТИ (${data.diff_seconds}с назад)`;
          } else {
            topBadge.className = "text-xs px-3 py-1 rounded-full border bg-rose-500/10 border-rose-500/30 text-rose-400";
            topBadge.innerHTML = `<i class="fa-solid fa-circle text-rose-500 text-[9px] mr-1.5"></i> ОБРЫВ СВЯЗИ`;
          }
        }

        // 2. Обновление плашки связи на самой вкладке мониторинга
        const connEl = document.getElementById('healthConnectionStatus');
        const pingEl = document.getElementById('healthLastPing');
        const pulseIcon = document.getElementById('healthPulseIcon');

        if (connEl && pingEl) {
          if (data.connection_status === 'ONLINE') {
            connEl.innerText = "В СЕТИ";
            connEl.className = "text-xl font-bold text-emerald-400";
            pingEl.innerText = `Пинг: ${data.diff_seconds} сек. назад (v${data.bot_version})`;
            if (pulseIcon) {
              pulseIcon.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping";
            }
          } else {
            connEl.innerText = "ОБРЫВ СВЯЗИ";
            connEl.className = "text-xl font-bold text-rose-400";
            pingEl.innerText = data.last_heartbeat === 0 ? "Сигналов не поступало" : `Молчит > ${Math.floor(data.diff_seconds / 60)} мин.`;
            if (pulseIcon) {
              pulseIcon.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
            }
          }
        }

        // 3. Обновление числовых карточек KPI
        const totalModsEl = document.getElementById('healthTotalMods');
        if (totalModsEl) totalModsEl.innerText = data.total_modules;

        const opCountEl = document.getElementById('healthOperational');
        if (opCountEl) opCountEl.innerText = data.operational_count;

        const attCountEl = document.getElementById('healthAttention');
        if (attCountEl) attCountEl.innerText = data.attention_count;

        const pctEl = document.getElementById('healthPercentage');
        if (pctEl) pctEl.innerText = data.readiness_percentage + '%';

        const barEl = document.getElementById('healthProgressBar');
        if (barEl) barEl.style.width = data.readiness_percentage + '%';

        // 4. Отрисовка строк таблицы с учетом текущих фильтров
        applyHealthFilters();

        if (!isSilent) {
          setStatus('Готово');
        }
      } else {
        if (!isSilent) setStatus('Сбой связи');
      }
    } catch (err) {
      console.error('Ошибка получения телеметрии:', err);
      if (!isSilent) {
        setStatus('Сбой сети');
      }
    }
  }

  /**
   * Применение поискового запроса и фильтра по статусу к таблице модулей.
   */
  function applyHealthFilters() {
    const searchInput = document.getElementById('healthSearchInput');
    const filterSelect = document.getElementById('healthStatusFilter');

    const q = searchInput ? searchInput.value.toLowerCase().trim() : '';
    const statusFilter = filterSelect ? filterSelect.value : 'ALL';

    const filtered = healthModulesData.filter(m => {
      const matchQ = !q || 
        m.name.toLowerCase().includes(q) || 
        m.files.toLowerCase().includes(q) || 
        m.test_cmd.toLowerCase().includes(q);

      const matchStatus = (statusFilter === 'ALL') || (m.status === statusFilter);
      return matchQ && matchStatus;
    });

    renderHealthTable(filtered);
  }

  /**
   * Построчный рендеринг таблицы 19 функциональных модулей.
   * @param {Array} modules - Отфильтрованный список модулей.
   */
  function renderHealthTable(modules) {
    const tbody = document.getElementById('healthTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    if (modules.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-slate-500">Модули не найдены по заданным критериям</td></tr>';
      return;
    }

    modules.forEach(m => {
      const tr = document.createElement('tr');
      tr.className = "hover:bg-slate-750 transition";

      let badgeClass = "bg-slate-700 text-slate-300 border-slate-600";
      if (m.status === 'В строю') {
        badgeClass = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
      } else if (m.status === 'Нет связи') {
        badgeClass = "bg-rose-500/20 text-rose-400 border-rose-500/30";
      } else if (m.status === 'Ошибка' || m.status === 'Требует внимания') {
        badgeClass = "bg-amber-500/20 text-amber-400 border-amber-500/30";
      }

      const hasError = m.error && m.error.trim().length > 0;

      tr.innerHTML = `
        <td class="px-4 py-3 text-center font-bold text-slate-400">${m.num}</td>
        <td class="px-4 py-3 font-semibold text-white">${m.name}</td>
        <td class="px-4 py-3 font-mono text-xs text-indigo-300">${m.files}</td>
        <td class="px-4 py-3 text-xs text-slate-300 font-mono bg-slate-900/40 p-1.5 rounded">${m.test_cmd}</td>
        <td class="px-4 py-3 text-xs text-slate-400"><span class="px-2 py-0.5 rounded bg-slate-800 border border-slate-700">${m.layer}</span></td>
        <td class="px-4 py-3 text-center">
          <span class="px-2.5 py-1 text-xs font-semibold rounded-full border ${badgeClass}">
            ${m.status}
          </span>
        </td>
        <td class="px-4 py-3 text-right">
          ${hasError ? `
            <button onclick="showHealthError(${m.num})" class="px-2 py-1 bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/30 rounded text-xs transition">
              <i class="fa-solid fa-bug mr-1"></i> Ошибка
            </button>
          ` : `
            <span class="text-xs text-slate-600">—</span>
          `}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  /**
   * Отображение модального окна с логом и деталями ошибки модуля.
   * @param {number} moduleNum - Порядковый номер модуля (1..19).
   */
  function showHealthError(moduleNum) {
    const mod = healthModulesData.find(x => x.num === moduleNum);
    if (!mod) return;

    const titleEl = document.getElementById('modalHealthTitle');
    const filesEl = document.getElementById('modalHealthFiles');
    const detailsEl = document.getElementById('modalHealthDetails');
    const modalEl = document.getElementById('modalHealthError');

    if (titleEl) titleEl.innerText = `Сбой модуля №${mod.num}: ${mod.name}`;
    if (filesEl) filesEl.innerText = mod.files;
    if (detailsEl) detailsEl.innerText = mod.error || "Детали ошибки не зафиксированы.";
    if (modalEl) modalEl.classList.remove('hidden');
  }

  /**
   * Отправка команды принудительного сквозного автотестирования всех 19 модулей.
   */
  async function triggerSelfTestBtn() {
    if (!confirm('Запустить полный комплекс автоматического тестирования всех 19 модулей бота?')) {
      return;
    }

    setStatus('Отправка команды тестов...');
    try {
      const res = await fetch('/api/trigger_test', { method: 'POST' });
      const data = await res.json();
      alert(data.message || 'Команда тестирования успешно зарегистрирована');
      setStatus('Готово');
    } catch (err) {
      alert('Ошибка отправки команды тестирования: ' + err.toString());
      setStatus('Сбой');
    }
  }

  // ====================================================================
  // 3. ЭТАЛОН И ДЕРЕВО КАТАЛОГА (GLOBAL_DICTIONARY)
  // ====================================================================

  /**
   * Полная асинхронная загрузка каталога эталона из PostgreSQL.
   */
  async function loadCatalog() {
    setStatus('Загрузка эталона...');
    try {
      const res = await fetch('/api/catalog');
      const data = await res.json();

      if (data.status === 'SUCCESS') {
        globalCatalog = data.items || [];
        globalTreeData = data.tree || {};

        loadSystemStats();
        populateCatalogCatSelect();
        applyCatalogFilters();
        setStatus('Готово');
      } else {
        alert('Ошибка загрузки каталога: ' + data.message);
        setStatus('Сбой');
      }
    } catch (err) {
      console.error('Ошибка загрузки эталона:', err);
      setStatus('Сбой сети');
    }
  }

  /**
   * Подгрузка агрегированных метрик базы (категории, статьи, синонимы).
   */
  async function loadSystemStats() {
    try {
      const res = await fetch('/api/stats');
      const data = await res.json();
      if (data.status === 'SUCCESS') {
        const stats = data.stats;
        const elCat = document.getElementById('statCats');
        const elSub = document.getElementById('statSubs');
        const elArt = document.getElementById('statArts');
        const elSyn = document.getElementById('statSyns');

        if (elCat) elCat.innerText = stats.categories;
        if (elSub) elSub.innerText = stats.subcategories;
        if (elArt) elArt.innerText = stats.articles;
        if (elSyn) elSyn.innerText = stats.synonyms;
      }
    } catch (e) {
      console.error('Ошибка получения сводных статистик:', e);
    }
  }

  /**
   * Заполнение выпадающего списка категорий для фильтрации.
   */
  function populateCatalogCatSelect() {
    const sel = document.getElementById('catalogFilterCat');
    if (!sel) return;

    const cats = Array.from(new Set(globalCatalog.map(x => x.category))).sort();
    sel.innerHTML = '<option value="ALL">Все категории</option>';

    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.innerText = c;
      sel.appendChild(opt);
    });
  }

  /**
   * Переключение режима отображения эталона: Дерево (Drag & Drop) / Таблица.
   * @param {string} mode - 'tree' | 'table'
   */
  function setCatalogView(mode) {
    const isTree = (mode === 'tree');
    const treeContainer = document.getElementById('catalogTreeContainer');
    const tableContainer = document.getElementById('catalogTableContainer');

    if (treeContainer) treeContainer.classList.toggle('hidden', !isTree);
    if (tableContainer) tableContainer.classList.toggle('hidden', isTree);

    const btnTree = document.getElementById('btnViewTree');
    const btnTable = document.getElementById('btnViewTable');

    if (btnTree) {
      btnTree.className = isTree
        ? "px-3 py-1.5 text-xs font-semibold rounded-md bg-indigo-600 text-white shadow-sm transition"
        : "px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition";
    }

    if (btnTable) {
      btnTable.className = !isTree
        ? "px-3 py-1.5 text-xs font-semibold rounded-md bg-indigo-600 text-white shadow-sm transition"
        : "px-3 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition";
    }
  }

  /**
   * Фильтрация элементов каталога по тексту, типу (Расход/Доход) и категории.
   */
  function applyCatalogFilters() {
    const searchEl = document.getElementById('catalogSearch');
    const typeEl = document.getElementById('catalogFilterType');
    const catEl = document.getElementById('catalogFilterCat');

    const q = searchEl ? searchEl.value.toLowerCase().trim() : '';
    const typeFilter = typeEl ? typeEl.value : 'ALL';
    const catFilter = catEl ? catEl.value : 'ALL';

    const filtered = globalCatalog.filter(item => {
      const matchesQ = !q || 
        item.article.toLowerCase().includes(q) || 
        item.category.toLowerCase().includes(q) || 
        item.subcategory.toLowerCase().includes(q) || 
        item.synonyms.toLowerCase().includes(q);

      const matchesType = (typeFilter === "ALL") || (item.type === typeFilter);
      const matchesCat = (catFilter === "ALL") || (item.category === catFilter);

      return matchesQ && matchesType && matchesCat;
    });

    renderCatalogTable(filtered);
    renderCatalogTree(filtered);
  }

  /**
   * Отрисовка плоской таблицы каталога.
   * @param {Array} rows - Строки каталога.
   */
  function renderCatalogTable(rows) {
    const tbody = document.getElementById('catalogTableBody');
    if (!tbody) return;
    tbody.innerHTML = '';

    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-500">Ничего не найдено</td></tr>';
      return;
    }

    rows.forEach(item => {
      const tr = document.createElement('tr');
      tr.className = "hover:bg-slate-750 transition";

      const badge = item.type === "Доход"
        ? `<span class="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded text-xs border border-emerald-500/30">Доход</span>`
        : `<span class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded text-xs border border-slate-600">Расход</span>`;

      tr.innerHTML = `
        <td class="px-4 py-2.5">${badge}</td>
        <td class="px-4 py-2.5 font-medium text-white">${item.category}</td>
        <td class="px-4 py-2.5 text-slate-400">${item.subcategory}</td>
        <td class="px-4 py-2.5 text-indigo-300 font-medium">${item.article}</td>
        <td class="px-4 py-2.5 text-slate-400 text-xs truncate max-w-xs" title="${item.synonyms || ''}">${item.synonyms || '—'}</td>
        <td class="px-4 py-2.5 text-right space-x-1 whitespace-nowrap">
          <button onclick="promptRename('article', '${item.type}', '${item.category}', '${item.subcategory}', '${item.article}')" class="p-1.5 text-slate-400 hover:text-indigo-400 rounded" title="Переименовать"><i class="fa-solid fa-pen text-xs"></i></button>
          <button onclick="promptMove('article', '${item.type}', '${item.category}', '${item.subcategory}', '${item.article}')" class="p-1.5 text-slate-400 hover:text-indigo-400 rounded" title="Перенести"><i class="fa-solid fa-arrows-up-down-left-right text-xs"></i></button>
          <button onclick="promptDelete('article', '${item.type}', '${item.category}', '${item.subcategory}', '${item.article}')" class="p-1.5 text-slate-400 hover:text-rose-400 rounded" title="Удалить"><i class="fa-solid fa-trash text-xs"></i></button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  /**
   * Интерактивное построение иерархического дерева Drag & Drop.
   * ПО УМОЛЧАНИЮ ВСЕ КАТЕГОРИИ СВЁРНУТЫ (.hidden, rotate(-90deg)).
   * @param {Array|null} filteredItems - Набор отфильтрованных элементов.
   */
  function renderCatalogTree(filteredItems = null) {
    const container = document.getElementById('catalogTreeContainer');
    if (!container) return;
    container.innerHTML = '';

    let treeToRender = globalTreeData;
    if (filteredItems) {
      treeToRender = { "Расход": {}, "Доход": {} };
      filteredItems.forEach(item => {
        if (!treeToRender[item.type]) treeToRender[item.type] = {};
        if (!treeToRender[item.type][item.category]) treeToRender[item.type][item.category] = {};
        if (!treeToRender[item.type][item.category][item.subcategory]) treeToRender[item.type][item.category][item.subcategory] = [];
        treeToRender[item.type][item.category][item.subcategory].push({
          article: item.article,
          synonyms: item.synonyms ? item.synonyms.split(',') : []
        });
      });
    }

    for (const opType of ['Расход', 'Доход']) {
      const catObj = treeToRender[opType] || {};
      const catKeys = Object.keys(catObj).sort();
      if (catKeys.length === 0 && filteredItems) continue;

      const typeCard = document.createElement('div');
      typeCard.className = "bg-slate-800 rounded-xl border border-slate-700 shadow-sm p-5 space-y-4";
      typeCard.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-700 pb-3">
          <h3 class="text-base font-bold text-white flex items-center gap-2">
            <span class="${opType === 'Доход' ? 'text-emerald-400' : 'text-slate-400'}">●</span>
            ${opType} (${catKeys.length} категорий)
          </h3>
          <button onclick="openCreateModal('category', '${opType}')" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-2.5 py-1.5 rounded-lg font-semibold flex items-center gap-1.5">
            <i class="fa-solid fa-plus"></i> Категория
          </button>
        </div>
        <div class="space-y-4" id="treeContent${opType}"></div>
      `;
      container.appendChild(typeCard);

      const typeBody = typeCard.querySelector(`#treeContent${opType}`);

      catKeys.forEach(catName => {
        const subsObj = catObj[catName];
        const subKeys = Object.keys(subsObj).sort();

        const catBlock = document.createElement('div');
        catBlock.className = "border border-slate-700/80 rounded-xl bg-slate-850/70 p-4 space-y-3 transition";

              <button onclick="promptRename('category', '${opType}', '${catName}', '', '${catName}')" class="p-1.5 text-slate-400 hover:text-indigo-300 rounded text-xs" title="Переименовать категорию"><i class="fa-solid fa-pen"></i></button>
              <button onclick="promptDelete('category', '${opType}', '${catName}')" class="p-1.5 text-slate-400 hover:text-rose-400 rounded text-xs" title="Удалить категорию"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
          <div class="pl-4 border-l-2 border-slate-700/80 space-y-3 subcategories-list hidden"></div>
        `;
        typeBody.appendChild(catBlock);

        const subList = catBlock.querySelector('.subcategories-list');

        subKeys.forEach(subName => {

          // Drag & Drop события подкатегории
          subCard.ondragstart = (e) => onDragStartSubcategory(e, opType, catName, subName, subCard);

          subCard.ondrop = (e) => onDropArticleOnSubcategory(e, opType, catName, subName, subCard);

                <span class="text-[11px] text-slate-400">(${arts.length} ст.)</span>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="openCreateModal('article', '${opType}', '${catName}', '${subName}')" class="text-[11px] text-indigo-400 hover:underline mr-1 font-medium">+ Статья</button>
                <button onclick="promptRename('subcategory', '${opType}', '${catName}', '${subName}', '${subName}')" class="p-1 text-slate-400 hover:text-indigo-300 rounded text-xs" title="Переименовать"><i class="fa-solid fa-pen"></i></button>
                <button onclick="promptMove('subcategory', '${opType}', '${catName}', '${subName}')" class="p-1 text-slate-400 hover:text-indigo-300 rounded text-xs" title="Перенести в другую категорию"><i class="fa-solid fa-arrows-up-down-left-right"></i></button>
                <button onclick="promptDelete('subcategory', '${opType}', '${catName}', '${subName}')" class="p-1 text-slate-400 hover:text-rose-400 rounded text-xs" title="Удалить подкатегорию"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${arts.map(a => `
                <div draggable="true"
                     ondragstart="onDragStartArticle(event, '${opType}', '${catName}', '${subName}', '${a.article}', this)"
                     ondragend="onDragEnd(this)"
                     class="group/art inline-flex items-center gap-1.5 bg-slate-900/80 hover:bg-indigo-950/60 border border-slate-700 hover:border-indigo-500/50 px-2.5 py-1 rounded-md text-xs font-medium text-slate-200 cursor-grab transition">
                  <i class="fa-solid fa-grip-lines-vertical text-slate-600 text-[10px]"></i>
                  <span>${a.article}</span>
                  <button onclick="promptRename('article', '${opType}', '${catName}', '${subName}', '${a.article}')" class="text-slate-500 hover:text-indigo-300 ml-1 opacity-0 group-hover/art:opacity-100 transition"><i class="fa-solid fa-pen text-[10px]"></i></button>
                  <button onclick="promptDelete('article', '${opType}', '${catName}', '${subName}', '${a.article}')" class="text-slate-500 hover:text-rose-400 opacity-0 group-hover/art:opacity-100 transition"><i class="fa-solid fa-xmark text-[10px]"></i></button>
                </div>

          subList.appendChild(subCard);

  /**
   * Сворачивание и разворачивание ветки категории при клике на заголовок.
   * @param {HTMLElement} headerElem - Заголовочный элемент категории.
   */
  function toggleSection(headerElem) {
    const catBlock = headerElem.closest('.border');
    if (!catBlock) return;

    const subList = catBlock.querySelector('.subcategories-list');
    const icon = headerElem.querySelector('.fa-chevron-down');
    if (!subList) return;

    const isHidden = subList.classList.toggle('hidden');
    if (icon) {
      icon.style.transform = isHidden ? 'rotate(-90deg)' : 'rotate(0deg)';
    }
  }

  // ====================================================================
  // 4. ОБРАБОТЧИКИ DRAG & DROP
  // ====================================================================

  function onDragStartArticle(e, type, category, subcategory, article, elem) {
    draggedEntity = { level: 'article', type, category, subcategory, article };
    elem.classList.add('dragging');
    e.stopPropagation();
  }

  function onDragStartSubcategory(e, type, category, subcategory, elem) {
    draggedEntity = { level: 'subcategory', type, category, subcategory };
    elem.classList.add('dragging');
    e.stopPropagation();
  }

  function onDragEnd(elem) {
    if (elem) elem.classList.remove('dragging');
  }

  function onDragOverContainer(e, elem) {
    e.preventDefault();
    e.stopPropagation();
    elem.classList.add('drag-over');
  }

  function onDragLeaveContainer(elem) {
    elem.classList.remove('drag-over');
  }

  async function onDropArticleOnSubcategory(e, toType, toCat, toSub, elem) {
    e.preventDefault();
    e.stopPropagation();
    elem.classList.remove('drag-over');

    if (!draggedEntity || draggedEntity.level !== 'article') return;
    if (draggedEntity.category === toCat && draggedEntity.subcategory === toSub) return;

    const payload = {
      level: 'article',
      type: draggedEntity.type,
      fromCategory: draggedEntity.category,
      fromSubcategory: draggedEntity.subcategory,
      article: draggedEntity.article,
      toCategory: toCat,
      toSubcategory: toSub
    };

    setStatus(`Перемещение «${draggedEntity.article}»...`);
    try {
      const res = await fetch('/api/catalog/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.status === "SUCCESS") {
        loadCatalog();
      } else {
        alert('Ошибка перемещения: ' + data.message);
      }
    } catch (err) {
      alert('Ошибка сети: ' + err.toString());
    }
  }

  async function onDropOnCategory(e, toType, toCat, elem) {
    e.preventDefault();
    e.stopPropagation();
    elem.classList.remove('drag-over');

    if (!draggedEntity || draggedEntity.level !== 'subcategory') return;
    if (draggedEntity.category === toCat) return;

    const payload = {
      level: 'subcategory',
      type: draggedEntity.type,
      fromCategory: draggedEntity.category,
      fromSubcategory: draggedEntity.subcategory,
      toCategory: toCat
    };

    setStatus(`Перемещение «${draggedEntity.subcategory}»...`);
    try {
      const res = await fetch('/api/catalog/move', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.status === "SUCCESS") {
        loadCatalog();
      } else {
        alert('Ошибка перемещения: ' + data.message);
      }
    } catch (err) {
      alert('Ошибка сети: ' + err.toString());
    }
  }

  // ====================================================================
  // 5. ДЕЙСТВИЯ КАТАЛОГА: СОЗДАНИЕ, ПЕРЕИМЕНОВАНИЕ, УДАЛЕНИЕ, ПЕРЕНОС
  // ====================================================================

  function openCreateModal(level = 'article', type = 'Расход', cat = '', sub = '') {
    const levelEl = document.getElementById('createLevel');
    const typeEl = document.getElementById('createType');

    if (levelEl) levelEl.value = level;
    if (typeEl) typeEl.value = type;

    updateCreateModalFields();

    if (cat) {
      const catSelect = document.getElementById('createCatSelect');
      if (catSelect) catSelect.value = cat;
      syncCreateSubcategorySelect();
      if (sub) {
        const subSelect = document.getElementById('createSubSelect');
        if (subSelect) subSelect.value = sub;
      }
    }

    const modal = document.getElementById('modalCreate');
    if (modal) modal.classList.remove('hidden');
  }

  function updateCreateModalFields() {
    const levelEl = document.getElementById('createLevel');
    const lvl = levelEl ? levelEl.value : 'article';

    syncCreateCategorySelect();

    const catInput = document.getElementById('createCatInput');
    const catSelectWrapper = document.getElementById('createCatSelectWrapper');
    const subInput = document.getElementById('createSubInput');
    const subSelectWrapper = document.getElementById('createSubSelectWrapper');
    const artContainer = document.getElementById('createArtContainer');
    const synsContainer = document.getElementById('createSynsContainer');

    if (lvl === 'category') {
      if (catInput) catInput.classList.remove('hidden');
      if (catSelectWrapper) catSelectWrapper.classList.add('hidden');
      if (subInput) subInput.classList.remove('hidden');
      if (subSelectWrapper) subSelectWrapper.classList.add('hidden');
      if (artContainer) artContainer.classList.add('hidden');
      if (synsContainer) synsContainer.classList.add('hidden');
    } else if (lvl === 'subcategory') {
      if (catInput) catInput.classList.add('hidden');
      if (catSelectWrapper) catSelectWrapper.classList.remove('hidden');
      if (subInput) subInput.classList.remove('hidden');
      if (subSelectWrapper) subSelectWrapper.classList.add('hidden');
      if (artContainer) artContainer.classList.add('hidden');
      if (synsContainer) synsContainer.classList.add('hidden');
    } else {
      if (catInput) catInput.classList.add('hidden');
      if (catSelectWrapper) catSelectWrapper.classList.remove('hidden');
      if (subInput) subInput.classList.add('hidden');
      if (subSelectWrapper) subSelectWrapper.classList.remove('hidden');
      if (artContainer) artContainer.classList.remove('hidden');
      if (synsContainer) synsContainer.classList.remove('hidden');
    }
  }

  function syncCreateCategorySelect() {
    const typeEl = document.getElementById('createType');
    const type = typeEl ? typeEl.value : 'Расход';
    const select = document.getElementById('createCatSelect');
    if (!select) return;

    select.innerHTML = '';
    const cats = Object.keys(globalTreeData[type] || {}).sort();
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c;
      opt.innerText = c;
      select.appendChild(opt);
    });

    syncCreateSubcategorySelect();
  }

  function syncCreateSubcategorySelect() {
    const typeEl = document.getElementById('createType');
    const type = typeEl ? typeEl.value : 'Расход';
    const catSelect = document.getElementById('createCatSelect');
    const cat = catSelect ? catSelect.value : '';
    const select = document.getElementById('createSubSelect');
    if (!select) return;

    select.innerHTML = '';
    const subs = Object.keys((globalTreeData[type] || {})[cat] || {}).sort();
    subs.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.innerText = s;
      select.appendChild(opt);
    });
  }

  async function submitCreateEntity() {
    const lvl = document.getElementById('createLevel').value;
    const type = document.getElementById('createType').value;
    const cat = (lvl === 'category')
      ? document.getElementById('createCatInput').value
      : document.getElementById('createCatSelect').value;

    const sub = (lvl === 'category' || lvl === 'subcategory')
      ? document.getElementById('createSubInput').value
      : document.getElementById('createSubSelect').value;

    const art = document.getElementById('createArtInput').value;
    const syns = document.getElementById('createSynsInput').value;

    const payload = { 
      level: lvl, 
      type: type, 
      category: cat, 
      subcategory: sub, 
      article: art, 
      synonyms: syns 
    };

    setStatus('Создание...');
    try {
      const res = await fetch('/api/catalog/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.status === "SUCCESS") {
        closeModal('modalCreate');
        loadCatalog();
      } else {
        alert('Ошибка создания: ' + data.message);
      }
    } catch (err) {
      alert('Ошибка сети: ' + err.toString());
    }
  }

  function promptRename(level, type, category, subcategory, oldName) {
    activeModalPayload = { level, type, category, subcategory, oldName };
    const titleEl = document.getElementById('modalRenameTitle');
    const inputEl = document.getElementById('modalRenameInput');

    if (titleEl) {
      titleEl.innerText = `Переименовать ${level === 'category' ? 'категорию' : level === 'subcategory' ? 'подкатегорию' : 'статью'}`;
    }
    if (inputEl) {
      inputEl.value = oldName;
    }

    const modal = document.getElementById('modalRename');
    if (modal) modal.classList.remove('hidden');
  }

  async function submitRenameEntity() {
    const inputEl = document.getElementById('modalRenameInput');
    const newName = inputEl ? inputEl.value.trim() : '';
    if (!newName) return;

    activeModalPayload.newName = newName;

    setStatus('Сохранение...');

      const res = await fetch('/api/catalog/rename', {

        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(activeModalPayload)
      });
      const data = await res.json();
      if (data.status === "SUCCESS") {
        closeModal('modalRename');
        loadCatalog();
      } else {
        alert('Ошибка переименования: ' + data.message);
      }
    } catch (err) {
      alert('Ошибка сети: ' + err.toString());
    }
  }

  async function promptDelete(level, type, category, subcategory = '', article = '') {
    const title = level === 'category' ? `КАТЕГОРИЮ «${category}» со всеми статьями`
      : level === 'subcategory' ? `ПОДКАТЕГОРИЮ «${subcategory}» со всеми статьями`
      : `СТАТЬЮ «${article}»`;

    if (!confirm(`Вы уверены, что хотите удалить ${title}?`)) {
      return;
    }

    const payload = { level, type, category, subcategory, article };
    setStatus('Удаление...');
    try {
      const res = await fetch('/api/catalog/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.status === "SUCCESS") {
        loadCatalog();
      } else {
        alert('Ошибка удаления: ' + data.message);
      }
    } catch (err) {
      alert('Ошибка сети: ' + err.toString());
    }
  }

  function promptMove(level, type, category, subcategory, article = '') {
    activeModalPayload = { level, type, fromCategory: category, fromSubcategory: subcategory, article };
    const titleEl = document.getElementById('modalMoveTitle');
    if (titleEl) {
      titleEl.innerText = `Переместить ${level === 'subcategory' ? 'подкатегорию ' + subcategory : 'статью ' + article}`;
    }

    const catSelect = document.getElementById('modalMoveCatSelect');
    if (catSelect) {
      catSelect.innerHTML = '';
      const cats = Object.keys(globalTreeData[type] || {}).sort();
      cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.innerText = c;
        catSelect.appendChild(opt);
      });
    }

    const subWrapper = document.getElementById('modalMoveSubWrapper');
    if (level === 'subcategory') {
      if (subWrapper) subWrapper.classList.add('hidden');
    } else {
      if (subWrapper) subWrapper.classList.remove('hidden');
      syncMoveSubcategorySelect();
    }

    const modal = document.getElementById('modalMove');
    if (modal) modal.classList.remove('hidden');
  }

  function syncMoveSubcategorySelect() {
    const type = activeModalPayload.type;
    const catSelect = document.getElementById('modalMoveCatSelect');
    const cat = catSelect ? catSelect.value : '';
    const subSelect = document.getElementById('modalMoveSubSelect');
    if (!subSelect) return;

    subSelect.innerHTML = '';
    const subs = Object.keys((globalTreeData[type] || {})[cat] || {}).sort();
    subs.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s;
      opt.innerText = s;
      subSelect.appendChild(opt);
    });
  }

  async function submitMoveEntity() {
    const catSelect = document.getElementById('modalMoveCatSelect');
    activeModalPayload.toCategory = catSelect ? catSelect.value : '';

    if (activeModalPayload.level === 'article') {
      const subSelect = document.getElementById('modalMoveSubSelect');
      activeModalPayload.toSubcategory = subSelect ? subSelect.value : '';

      const res = await fetch('/api/catalog/move', {

        headers: { 'Content-Type': 'application/json' },

      });

      if (data.status === "SUCCESS") {
        closeModal('modalMove');
        loadCatalog();
      } else {
        alert('Ошибка перемещения: ' + data.message);
      }
    } catch (err) {
      alert('Ошибка сети: ' + err.toString());
    }

  function closeModal(id) {

    if (modal) modal.classList.add('hidden');

  // ====================================================================
  // 6. МОДЕРАЦИЯ НОВЫХ СЛОВ ПОЛЬЗОВАТЕЛЕЙ (USER_DICTIONARY) И КОРЗИНА
  // ====================================================================

  function switchModerationTab(mode) {
    currentModerationMode = mode;
    selectedIndices.clear();

    const btnPending = document.getElementById('subTabPendingBtn');
    const btnTrash = document.getElementById('subTabTrashBtn');

    if (btnPending) {
      btnPending.className = (mode === 'pending')
        ? "px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white shadow flex items-center space-x-2"
        : "px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center space-x-2";
    }

    if (btnTrash) {
      btnTrash.className = (mode === 'trash')
        ? "px-4 py-2 text-sm font-semibold rounded-lg bg-rose-700 text-white shadow flex items-center space-x-2"
        : "px-4 py-2 text-sm font-semibold rounded-lg bg-slate-800 text-slate-400 hover:text-white flex items-center space-x-2";
    }

    const pendingActions = document.getElementById('pendingActionButtons');
    const trashActions = document.getElementById('trashActionButtons');

    if (pendingActions) pendingActions.classList.toggle('hidden', mode !== 'pending');
    if (trashActions) trashActions.classList.toggle('hidden', mode !== 'trash');

    loadModerationData();
  }

  async function loadModerationData() {
    setStatus('Загрузка списка...');
    selectedIndices.clear();
    const endpoint = (currentModerationMode === 'pending') ? '/api/words/pending' : '/api/words/trash';

    try {
      const res = await fetch(endpoint);
      const data = await res.json();

      if (data.status === 'SUCCESS') {
        cachedData = data.rows || [];

        const userWordsBadge = document.getElementById('userWordsBadge');
        const trashWordsBadge = document.getElementById('trashWordsBadge');

        if (currentModerationMode === 'pending' && userWordsBadge) {
          userWordsBadge.innerText = cachedData.length;
        } else if (trashWordsBadge) {
          trashWordsBadge.innerText = cachedData.length;
        }

        let html = '';
        cachedData.forEach(row => {
          html += `<tr class="hover:bg-slate-750 transition">
            <td class="px-4 py-2.5 text-center">
              <input type="checkbox" onchange="toggleRowSelection(${row.id}, this.checked)" class="rounded bg-slate-700 border-slate-600 text-indigo-500 focus:ring-0">
            </td>
            <td class="px-4 py-2.5"><span class="px-2 py-0.5 text-xs rounded ${row.type === 'Доход' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${row.type}</span></td>
            <td class="px-4 py-2.5 text-slate-300">${row.category || '—'}</td>
            <td class="px-4 py-2.5 text-slate-400">${row.subcategory || '—'}</td>
            <td class="px-4 py-2.5 text-white font-medium">${row.article}</td>
            <td class="px-4 py-2.5 text-indigo-300 font-mono text-xs">${row.synonym}</td>
          </tr>`;
        });

        const tbody = document.getElementById('moderationTableBody');
        if (tbody) {
          tbody.innerHTML = html || '<tr><td colspan="6" class="text-center py-6 text-slate-500">Записей нет</td></tr>';
        }

        setStatus('Готово');
      }
    } catch (err) {
      console.error('Ошибка загрузки модерации:', err);
      setStatus('Сбой сети');
    }
  }

  function toggleRowSelection(id, checked) {
    if (checked) selectedIndices.add(id);
    else selectedIndices.delete(id);
  }

  function toggleSelectAll(checked) {
    selectedIndices.clear();
    const checkboxes = document.querySelectorAll('#moderationTableBody input[type="checkbox"]');
    checkboxes.forEach((cb, i) => {
      cb.checked = checked;
      if (checked && cachedData[i]) {
        selectedIndices.add(cachedData[i].id);
      }
    });
  }

  async function deleteSelectedWords() {
    if (selectedIndices.size === 0) {
      return alert('Выберите хотя бы одну запись для удаления');
    }

    setStatus('Перемещение в корзину...');
    try {
      const res = await fetch('/api/words/trash', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: Array.from(selectedIndices) })
      });
      const data = await res.json();
      if (data.status === "SUCCESS") {
        loadModerationData();
      } else {
        alert('Ошибка удаления: ' + data.message);
      }
    } catch (err) {
      alert('Ошибка сети: ' + err.toString());
    }
  }

  async function restoreSelectedWords() {
    if (selectedIndices.size === 0) {
      return alert('Выберите хотя бы одну запись для восстановления');
    }

    setStatus('Восстановление...');
    try {
      const res = await fetch('/api/words/restore', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: Array.from(selectedIndices) })
      });
      const data = await res.json();
      if (data.status === "SUCCESS") {
        loadModerationData();
      } else {
        alert('Ошибка восстановления: ' + data.message);
      }
    } catch (err) {
      alert('Ошибка сети: ' + err.toString());
    }
  }

  async function approveSelectedWords() {
    if (selectedIndices.size === 0) {
      return alert('Выберите хотя бы одну запись для одобрения');
    }

    setStatus('Одобрение...');
    try {
      const res = await fetch('/api/words/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ids: Array.from(selectedIndices) })
      });
      const data = await res.json();
      if (data.status === "SUCCESS") {
        loadModerationData();
        loadCatalog();
      } else {
        alert('Ошибка одобрения: ' + data.message);
      }
    } catch (err) {
      alert('Ошибка сети: ' + err.toString());
    }
  }
</script>
